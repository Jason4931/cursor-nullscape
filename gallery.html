<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Animated Gallery</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
        user-select: none;
      }

      body {
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(-45deg, #000000, #111111, #1a1a1a, #000000);
        background-size: 400% 400%;
        animation: bgMove 12s ease infinite;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Animated Background */
      @keyframes bgMove {
        0% {
          background-position: 0% 50%;
        }

        50% {
          background-position: 100% 50%;
        }

        100% {
          background-position: 0% 50%;
        }
      }

      /* Floating particles */
      body::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.04) 2px,
          transparent 2px
        );
        background-size: 80px 80px;
        animation: float 40s linear infinite;
        opacity: 0.3;
      }

      @keyframes float {
        from {
          transform: translate(0, 0);
        }

        to {
          transform: translate(-200px, -200px);
        }
      }

      .slideshow {
        position: relative;
        width: 70vw;
        height: 65vh;
        max-width: 1200px;
        border-radius: 20px;
        overflow: hidden;
        backdrop-filter: blur(20px);
        box-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
      }

      /* Image */
      .slideshow img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transform: scale(1.05);
        transition:
          opacity 0.6s ease,
          transform 0.6s ease;
      }

      .slideshow img.active {
        opacity: 1;
        transform: scale(1);
      }

      /* Arrows */
      .arrow {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 60px;
        color: white;
        cursor: pointer;
        user-select: none;
        padding: 15px 25px;
        border-radius: 50%;
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.05);
        transition: all 0.3s ease;
      }

      .arrow:hover {
        background: rgba(255, 255, 255, 0.15);
        transform: translateY(-50%) scale(1.1);
      }

      .left {
        left: 20px;
      }

      .right {
        right: 20px;
      }

      /* Responsive */
      @media (max-width: 768px) {
        .slideshow {
          width: 90vw;
          height: 60vh;
        }

        .arrow {
          font-size: 40px;
        }
      }

      /* Return Button */
      .return-btn {
        position: absolute;
        top: 25px;
        left: 25px;
        padding: 10px 18px;
        font-size: 16px;
        color: white;
        text-decoration: none;
        border-radius: 12px;
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
        transition: all 0.3s ease;
        animation: fadeInTop 0.8s ease forwards;
        opacity: 0;
      }

      /* Hover effect */
      .return-btn:hover {
        background: rgba(255, 255, 255, 0.18);
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
        transform: scale(1.05);
      }

      /* Entrance animation */
      @keyframes fadeInTop {
        from {
          transform: translateY(-20px);
          opacity: 0;
        }

        to {
          transform: translateY(0);
          opacity: 1;
        }
      }
    </style>
  </head>

  <body>
    <a href="./credit.html" class="return-btn">⮌ Return</a>
    <div class="slideshow">
      <img id="slide" class="active" src="" />
      <div class="arrow left" onclick="prev()">&#60;</div>
      <div class="arrow right" onclick="next()">&#62;</div>
    </div>

    <script>
      const images = [
        "Gallery/1WorstPuri.png",
        "Gallery/2DebtCata.png",
        "Gallery/3ThousandCascade.png",
        "Gallery/Cinema.png",
      ];

      let index = 0;
      const slide = document.getElementById("slide");

      function show() {
        clearInterval(interval);
        interval = setInterval(next, 10000);

        slide.classList.remove("active");

        setTimeout(() => {
          slide.src = images[index];
          slide.classList.add("active");
        }, 200);
      }

      function next() {
        index = (index + 1) % images.length;
        show();
      }

      function prev() {
        index = (index - 1 + images.length) % images.length;
        show();
      }

      /* Keyboard Support */
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") next();
        if (e.key === "ArrowLeft") prev();
      });

      /* Auto Play */
      let interval = setInterval(next, 10000);

      show();
    </script>
  </body>
</html>
